# Agent-only deployment: deploy node.
#
# Usage:
#   cp .env.agent.example .env   # then edit .env
#   docker compose -f docker-compose.agent-deploy.yml up -d

services:
  muvee-agent-deploy:
    image: ghcr.io/hoveychen/muvee:latest
    command: ["agent"]
    restart: unless-stopped
    hostname: muvee-agent-deploy
    env_file:
      - .proxy.env
    environment:
      NODE_ROLE: deploy
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL}
      AGENT_SECRET: ${AGENT_SECRET}
      DATA_DIR: ${DATA_DIR:-/muvee/data}
      # HOST_IP is auto-detected by default.
      # Set HOST_IP in .env only if auto-detection picks the wrong interface.
      HOST_IP: ${HOST_IP}
      # NODE_NAME pins the agent's identity across restarts/upgrades.
      # Override in .env if you run multiple deploy agents on different hosts.
      NODE_NAME: ${NODE_NAME:-muvee-agent-deploy}
      # muvee-mesh (project-to-project access, docs/docs/project-mesh.md): the
      # agent joins the docker network muvee-mesh at a fixed IP and serves DNS
      # + an HTTP gateway for http://<prefix>.muvee.internal. Defaults work;
      # override only when needed:
      #   MESH_SUBNET: "10.213.0.0/16"        # subnet if the agent creates muvee-mesh (clash with LAN/VPN)
      #   MESH_GATEWAY_IP: "10.213.0.2"       # agent's fixed IP on muvee-mesh, inside MESH_SUBNET
      #   MESH_FALLBACK_DNS: "1.1.1.1,8.8.8.8" # 2nd resolver for project containers while the agent is down (auto-detected)
      #   MESH_SELF_CONTAINER: "muvee-agent-deploy" # agent's own container, if /proc/self/mountinfo detection fails
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_data:/muvee/data
      # Workspace volume (optional): uncomment if VOLUME_NFS_BASE_PATH is set on control plane.
      # - ${VOLUME_NFS_BASE_PATH}:${VOLUME_NFS_BASE_PATH}:rw
      # Dataset NFS base (optional): uncomment if DATASET_NFS_BASE_PATH is set on control plane.
      # - ${DATASET_NFS_BASE_PATH}:${DATASET_NFS_BASE_PATH}:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Watchtower — auto-pulls new ghcr.io/hoveychen/muvee:latest and restarts ─
  # Only watches containers labeled `com.centurylinklabs.watchtower.enable=true`.
  # Opt-in via the `auto-update` Compose profile: set COMPOSE_PROFILES=auto-update
  # in your .env (or `docker compose --profile auto-update up -d`).
  watchtower:
    image: nickfedor/watchtower:latest
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  agent_data:
